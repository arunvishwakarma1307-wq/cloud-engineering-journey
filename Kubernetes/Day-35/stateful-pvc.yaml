apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-demo
spec:
  serviceName: storage-demo
  replicas: 2
  selector:
    matchLabels:
      app: storage-demo
  template:
    metadata:
      labels:
        app: storage-demo
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app-storage
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: app-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi