name: Day-28 GitHub Actions Matrix Strategy

on:
  workflow_dispatch:
  push:
    paths:
      - "CI-CD/Day-28/**"
      - ".github/workflows/day28-matrix-strategy.yml"

permissions:
  contents: read

jobs:
  matrix-test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display environment details
        run: |
          python --version
          python -c "import platform; print('Operating system:', platform.system())"

      - name: Matrix test completed
        run: echo "Matrix configuration completed successfully."