name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DAY7_ENV: "cloud-engineering-day-07"

jobs:
  build:
    env:
      DAY7_ENV: "cloud-engineering-day-08-job"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      build-version: ${{ steps.generate-value.outputs.BUILD_VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build stage
        env:
          DAY7_ENV: "cloud-engineering-day-08-step"
        run: |
          echo "Starting build stage..."
          echo "Repository checkout successful."
          echo "Build stage completed successfully."
          echo "Step-level environment: $DAY7_ENV"

      - name: Check job-level environment
        run: |
          echo "Job-level environment: $DAY7_ENV"

      - name: Generate build value
        id: generate-value
        run: |
          BUILD_VERSION="day-05-build-001"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated build version: $BUILD_VERSION"

      - name: Conditional step
        if: ${{ steps.generate-value.outputs.BUILD_VERSION == 'day-05-build-001' }}
        run: |
          echo "Condition is TRUE."
          echo "Conditional step executed successfully."

      - name: Check repository secret
        env:
          DAY4_SECRET: ${{ secrets.DAY4_TEST_SECRET }}
        run: |
          if [ -n "$DAY4_SECRET" ]; then
            echo "Repository secret is available."
          else
            echo "Repository secret is not available."
            exit 1
          fi

      - name: Create build artifact
        run: |
          mkdir build-output
          echo "Cloud Engineering Journey - Day 04" > build-output/build-info.txt
          echo "GitHub Actions secret check completed successfully." >> build-output/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: day-04-build-artifact
          path: build-output/

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Receive build output
        env:
          BUILD_VERSION: ${{ needs.build.outputs.build-version }}
        run: |
          echo "Received build version: $BUILD_VERSION"
          echo "Test job received the output from build job successfully."

      - name: Test stage
        run: |
          echo "Starting test stage..."
          echo "Tests completed successfully."

  deploy:
    needs: test
    if: ${{ success() }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy stage
        run: |
          echo "Test job completed successfully."
          echo "Deploy job condition is TRUE."
          echo "Deployment stage executed successfully."

  failure-demo:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Intentional failure
        run: |
          echo "Starting intentional failure demonstration..."
          echo "This job will fail for Day-10 testing."
          exit 1

  cleanup:
    needs: failure-demo
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup and reporting stage
        run: |
          echo "Failure-demo job finished."
          echo "always() condition is TRUE."
          echo "Cleanup/reporting stage executed despite previous failure."

  continue-on-error-demo:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Allowed failure
        continue-on-error: true
        run: |
          echo "Starting continue-on-error demonstration..."
          echo "This step will fail, but the job will continue."
          exit 1

      - name: Continue after failure
        run: |
          echo "The previous step failed."
          echo "continue-on-error allowed this step to continue."
          echo "Workflow execution continued successfully."