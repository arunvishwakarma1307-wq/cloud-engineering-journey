name: Basic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI check
        run: |
          echo "Starting CI check..."
          echo "Repository checkout successful."
          echo "This check will fail intentionally."
          exit 1