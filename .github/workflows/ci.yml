name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      build-version: ${{ steps.generate-value.outputs.BUILD_VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build stage
        run: |
          echo "Starting build stage..."
          echo "Repository checkout successful."
          echo "Build stage completed successfully."

      - name: Generate build value
        id: generate-value
        run: |
          BUILD_VERSION="day-05-build-001"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated build version: $BUILD_VERSION"

      - name: Check repository secret
        env:
          DAY4_SECRET: ${{ secrets.DAY4_TEST_SECRET }}
        run: |
          if [ -n "$DAY4_SECRET" ]; then
            echo "Repository secret is available."
          else
            echo "Repository secret is not available."
            exit 1
          fi

      - name: Create build artifact
        run: |
          mkdir build-output
          echo "Cloud Engineering Journey - Day 04" > build-output/build-info.txt
          echo "GitHub Actions secret check completed successfully." >> build-output/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: day-04-build-artifact
          path: build-output/

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Receive build output
        env:
          BUILD_VERSION: ${{ needs.build.outputs.build-version }}
        run: |
          echo "Received build version: $BUILD_VERSION"
          echo "Test job received the output from build job successfully."

      - name: Test stage
        run: |
          echo "Starting test stage..."
          echo "Tests completed successfully."