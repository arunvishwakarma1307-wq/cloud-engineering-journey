name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build stage
        run: |
          echo "Starting build stage..."
          echo "Repository checkout successful."
          echo "Build stage completed successfully."

      - name: Create build artifact
        run: |
          mkdir build-output
          echo "Cloud Engineering Journey - Day 03" > build-output/build-info.txt
          echo "GitHub Actions artifact created successfully." >> build-output/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: day-03-build-artifact
          path: build-output/

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Test stage
        run: |
          echo "Starting test stage..."
          echo "Tests completed successfully."