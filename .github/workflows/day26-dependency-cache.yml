
name: Day-26 Dependency Caching

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-cache-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and cache dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CI-CD/Day-26/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CI-CD/Day-26/requirements.txt

      - name: Verify cached dependency
        run: |
          python --version
          python -c "import requests; print('Requests version:', requests.__version__)"
