name: Day 35 - End-to-End CI-CD Pipeline

on:
  push:
    paths:
      - "CI-CD/Day-35/**"
      - ".github/workflows/day35-e2e-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CI-CD/Day-35/requirements.txt

      - name: Run Tests
        run: |
          python -m pytest CI-CD/Day-35/tests -v

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t day35-cicd-app:1.0 \
            -f CI-CD/Day-35/Dockerfile \
            CI-CD/Day-35

      - name: Run Docker Container
        run: |
          docker run --name day35-container day35-cicd-app:1.0

      - name: Create Application Package
        run: |
          cd CI-CD/Day-35
          zip -r ../../day35-app-package.zip app tests Dockerfile requirements.txt

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: day35-app-package
          path: day35-app-package.zip

  deploy:
    name: Validate Deployment Package
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: day35-app-package
          path: deployment-package

      - name: Validate Package
        run: |
          test -s deployment-package/day35-app-package.zip
          unzip -l deployment-package/day35-app-package.zip
          echo "Deployment package validation successful!"